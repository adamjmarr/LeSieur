<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voyage LeSieur</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/normalize.css">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!--header-->

    <header class="header">

        <div class="wrapper">

            <a href="index.html" class="logo">

                <img src="img/img/logo1.png" alt="logo"> Voyage LeSieur

            </a>

            <nav class="nav">
                <ul class="menu">
                    <li><a href="#">Magaziner</a></li>
                    <li><a href="#">Support</a></li>
                    <li><a href="#">Blogue</a></li>
                </ul>
            </nav>

        </div>

    </header>

    <!--hero-->

    <section class="hero">

        <div class="wrapper">

            <h1>Trouver tout pour le voyage!</h1>

        </div>

        <!--contenu-->

    </section>

    <section class="transports">

        <div class="wrapper">

            <div class="titre-section">

                <h2>Transports</h2>

                <img src="img/img/iconeplus.png" alt="bouton plus">

            </div>

            <div class="conteneur-transports">

                <article class="transport">

                    <img src="img/img/avion.png" alt="forfaits avion">

                    <h3>Forfaits <strong>avion</strong></h3>

                    <p>Voyager rapidement et comfortablement</p>

                </article>

                <article class="transport">

                    <img src="img/img/auto.png" alt="forfaits voiture">

                    <h3>Forfait <strong>voiture</strong></h3>

                    <p>Voitures de luxe pour plus de confort</p>

                </article>

                <article class="transport">

                    <img src="img/img/bateau.png" alt="forfait croisiere">

                    <h3>Forfait <strong>croisière</strong></h3>

                    <p>Voyager rapidement et comfortablement</p>

                </article>

            </div>

        </div>

    </section>

    <!--footer-->

    <footer class="footer">

        <div class="wrapper">

            <p>Voyage LeSieur</p>

            <nav>
                <ul class="menu-social">
                    <li class="twitter"><a href="#"><img src="img/img/social.png" alt="twitter"></a></li>
                    <li class="facebook"><a href="#"><img src="img/img/social.svg" alt="facebook"></a></li>
                    <li class="linkton"><a href="#"><img src="img/img/in.png" alt="in"></a></li>
                </ul>
            </nav>

        </div>
    </footer>
